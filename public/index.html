<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>199 错题本 · AI 老师</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登录/注册 -->
  <div id="auth-screen" class="screen auth-screen">
    <div class="auth-card">
      <h1 class="auth-title">199 错题本</h1>
      <p class="auth-sub">管理类联考综合能力 · 拍照录题 · AI 讲解 · 重做复习</p>
      <form id="auth-form" class="auth-form">
        <label class="field">
          <span>用户名</span>
          <input type="text" name="username" autocomplete="username" required minlength="2" maxlength="32" />
        </label>
        <label class="field">
          <span>密码</span>
          <input type="password" name="password" autocomplete="current-password" required minlength="6" />
        </label>
        <label class="field" id="invite-field" hidden>
          <span>邀请码</span>
          <input type="text" name="inviteCode" autocomplete="off" />
        </label>
        <div class="auth-actions">
          <button type="submit" class="btn btn-primary" id="auth-submit">登录</button>
          <button type="button" class="btn" id="auth-toggle">去注册</button>
        </div>
        <p class="auth-error" id="auth-error" hidden></p>
      </form>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="app" class="screen app-screen" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand">199 错题本</span>
      </div>
      <nav class="topbar-nav" id="nav">
        <a href="#/home" data-route="home">工作台</a>
        <a href="#/capture" data-route="capture">录题</a>
        <a href="#/list" data-route="list">错题</a>
        <a href="#/review" data-route="review">复习</a>
        <a href="#/more" data-route="more">更多</a>
      </nav>
      <div class="topbar-right">
        <span class="user-name" id="user-name"></span>
        <button class="btn btn-ghost" id="logout-btn">退出</button>
      </div>
    </header>

    <main id="view" class="view"></main>
  </div>

  <!-- 图片裁剪/旋转浮层（录题用） -->
  <div id="modal-root"></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
